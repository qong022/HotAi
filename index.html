<!DOCTYPE html>
<html lang="en" class="bg-black">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#000000" />
  <title>Hot Ai — presented by Sajit Gazula</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'ui-monospace', 'monospace'],
          },
          colors: {
            hyper: { cyan: '#22d3ee', violet: '#a855f7', pink: '#f472b6', groq: '#f97316' },
          },
        },
      },
    };
  </script>
  <style>
    :root { --ease: cubic-bezier(.22, 1, .36, 1); }
    html, body { height: 100%; }
    body { -webkit-font-smoothing: antialiased; }
    * { -webkit-tap-highlight-color: transparent; }
    ::selection { background: rgba(255,255,255,.18); }

    /* ================= CINEMATIC SPLASH ================= */
    #splash { transition: opacity 0.85s cubic-bezier(0.65, 0, 0.35, 1); }
    #splash.is-leaving { opacity: 0; pointer-events: none; }

    .fuse-logo { position: absolute; left: 50%; top: 50%; width: 76px; height: 76px; margin: -38px 0 0 -38px; opacity: 0; will-change: transform, opacity, filter; }
    .fuse-ollama { --from-x: -260px; --from-y: -70px; color: #f59e0b; filter: drop-shadow(0 0 16px rgba(245,158,11,0.85)) drop-shadow(0 0 32px rgba(245,158,11,0.4)); animation: fuseInLeft 1.25s linear forwards, fuseVanish 0.12s ease-in 1.25s forwards; }
    .fuse-groq { --from-x: 230px; --from-y: -110px; color: #ff5722; filter: drop-shadow(0 0 16px rgba(255,87,34,0.9)) drop-shadow(0 0 34px rgba(239,68,68,0.5)); animation: fuseInRight 1.25s linear forwards, fuseVanish 0.12s ease-in 1.25s forwards; }
    .fuse-gemini { --from-x: 0px; --from-y: 200px; filter: drop-shadow(0 0 16px rgba(34,211,238,0.9)) drop-shadow(0 0 36px rgba(168,85,247,0.6)); animation: fuseInBottom 1.25s linear forwards, fuseVanish 0.12s ease-in 1.25s forwards; }

    @keyframes fuseInLeft { 0% { opacity: 0; transform: translate(var(--from-x), var(--from-y)) scale(0.6); } 30% { opacity: 1; transform: translate(calc(var(--from-x) * 0.7), calc(var(--from-y) * 0.7)) scale(1); } 70% { opacity: 1; transform: translate(calc(var(--from-x) * 0.3), calc(var(--from-y) * 0.3)) scale(1.05); } 100% { opacity: 1; transform: translate(0, 0) scale(0.85); } }
    @keyframes fuseInRight { 0% { opacity: 0; transform: translate(var(--from-x), var(--from-y)) scale(0.6); } 30% { opacity: 1; transform: translate(calc(var(--from-x) * 0.7), calc(var(--from-y) * 0.7)) scale(1); } 70% { opacity: 1; transform: translate(calc(var(--from-x) * 0.3), calc(var(--from-y) * 0.3)) scale(1.05); } 100% { opacity: 1; transform: translate(0, 0) scale(0.85); } }
    @keyframes fuseInBottom { 0% { opacity: 0; transform: translate(var(--from-x), var(--from-y)) scale(0.6); } 30% { opacity: 1; transform: translate(calc(var(--from-x) * 0.7), calc(var(--from-y) * 0.7)) scale(1); } 70% { opacity: 1; transform: translate(calc(var(--from-x) * 0.3), calc(var(--from-y) * 0.3)) scale(1.05); } 100% { opacity: 1; transform: translate(0, 0) scale(0.85); } }
    @keyframes fuseVanish { to { opacity: 0; transform: translate(0, 0) scale(0.2); } }

    .fuse-flash { position: absolute; left: 50%; top: 50%; width: 200px; height: 200px; margin: -100px 0 0 -100px; border-radius: 9999px; background: radial-gradient(circle, #fff 0%, rgba(34,211,238,0.95) 22%, rgba(168,85,247,0.7) 45%, rgba(244,114,182,0.2) 65%, transparent 75%); opacity: 0; will-change: transform, opacity, filter; animation: fuseFlash 1.1s cubic-bezier(.16, 1, .3, 1) 1.25s forwards; }
    @keyframes fuseFlash { 0% { opacity: 0; transform: scale(0.1); filter: blur(2px); } 15% { opacity: 1; transform: scale(1.4); filter: blur(8px); } 100% { opacity: 0; transform: scale(8); filter: blur(55px); } }

    .fuse-ring { position: absolute; left: 50%; top: 50%; width: 140px; height: 140px; margin: -70px 0 0 -70px; border-radius: 9999px; border: 1.5px solid rgba(255,255,255,0.9); box-shadow: 0 0 30px rgba(34,211,238,0.8), inset 0 0 25px rgba(168,85,247,0.7); opacity: 0; animation: fuseRing 1.2s cubic-bezier(.16, 1, .3, 1) 1.26s forwards; }
    @keyframes fuseRing { 0% { opacity: 1; transform: scale(0.2); } 100% { opacity: 0; transform: scale(9.5); } }

    .title-hyper { opacity: 0; will-change: transform, opacity, filter, letter-spacing; animation: hyperSurge 1.4s cubic-bezier(.16, 1, .3, 1) 1.32s forwards; }
    @keyframes hyperSurge { 0% { opacity: 0; transform: scale(0.85); filter: blur(14px); letter-spacing: 0.1em; } 25% { opacity: 1; transform: scale(1.08); filter: blur(0px); letter-spacing: 0.35em; } 75% { opacity: 1; transform: scale(1); filter: blur(0px); letter-spacing: 0.32em; } 100% { opacity: 0; transform: scale(1.18); filter: blur(10px); letter-spacing: 0.45em; } }

    .title-hotai { opacity: 0; animation: hotAiReveal 1.1s cubic-bezier(.22, 1, .36, 1) 2.7s forwards; }
    @keyframes hotAiReveal { 0% { opacity: 0; transform: scale(1.15); filter: blur(16px); } 100% { opacity: 1; transform: scale(1); filter: blur(0); } }
    .fuse-gradient { background: linear-gradient(110deg, #ffffff 0%, #a5f3fc 25%, #c084fc 50%, #f472b6 75%, #ffffff 100%); background-size: 240% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: sheenShift 5s ease-in-out infinite alternate; }
    @keyframes sheenShift { from { background-position: 0% 50%; } to { background-position: 100% 50%; } }
    .sig-sajit { opacity: 0; transform: translateY(12px); animation: sigReveal 0.9s cubic-bezier(.22, 1, .36, 1) 3.1s forwards; }
    @keyframes sigReveal { to { opacity: 1; transform: translateY(0); } }

    /* ================= GLASS & COMPONENT STYLING ================= */
    .glass { background: linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,.025)); backdrop-filter: blur(24px) saturate(140%); -webkit-backdrop-filter: blur(24px) saturate(140%); border: 1px solid rgba(255,255,255,.09); box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 20px 60px -20px rgba(0,0,0,.9); }
    .gloss { position: relative; overflow: hidden; }
    .gloss::before { content: ''; position: absolute; inset: 0 0 50% 0; pointer-events: none; background: linear-gradient(180deg, rgba(255,255,255,.16), rgba(255,255,255,0)); border-radius: inherit; }
    .smooth { transition: all .4s var(--ease); }

    /* Network state toggle */
    #networkToggle { transition: all .45s var(--ease); }
    #networkToggle[aria-checked="true"] { border-color: rgba(34,211,238,0.5); background: linear-gradient(135deg, rgba(34,211,238,0.18), rgba(168,85,247,0.22)); box-shadow: 0 0 24px rgba(34,211,238,0.35), 0 0 45px rgba(168,85,247,0.2), inset 0 1px 0 rgba(255,255,255,0.2); }
    #networkToggle .knob { transition: transform .45s var(--ease), background .45s var(--ease), box-shadow .45s var(--ease); }
    #networkToggle[aria-checked="true"] .knob { transform: translateX(20px); background: #22d3ee; box-shadow: 0 0 14px #22d3ee; }

    /* Dock mode cards */
    .mode-card { transition: transform .45s var(--ease), box-shadow .45s var(--ease), border-color .45s var(--ease), background .45s var(--ease); }
    .mode-card:hover, .mode-card:focus-visible { transform: translateY(-6px); border-color: rgba(255,255,255,.22); box-shadow: 0 20px 40px -16px rgba(0,0,0,1), 0 0 26px -6px var(--accent); }
    .mode-card[aria-pressed="true"] { border-color: rgba(255,255,255,.32); background: linear-gradient(180deg, rgba(255,255,255,.12), rgba(255,255,255,.03)); box-shadow: 0 0 0 1px rgba(255,255,255,.08), 0 0 32px -6px var(--accent); }
    .mode-card .dot { background: var(--accent); box-shadow: 0 0 12px var(--accent); }

    /* Hyper cluster card */
    .hyper-card { position: relative; border-radius: 1.25rem; padding: 1.5px; background: linear-gradient(120deg, #22d3ee, #a855f7, #f472b6, #22d3ee); background-size: 300% 300%; animation: hyperShift 5s linear infinite; transition: transform .45s var(--ease), box-shadow .45s var(--ease); height: 6rem; display: flex; }
    .hyper-card:hover, .hyper-card:focus-visible { transform: translateY(-8px) scale(1.02); box-shadow: 0 0 30px rgba(168,85,247,.5), 0 0 60px rgba(34,211,238,.25); }
    .hyper-card .inner { flex: 1; border-radius: calc(1.25rem - 1.5px); background: radial-gradient(120% 90% at 100% 0%, rgba(168,85,247,.35), transparent 55%), radial-gradient(100% 80% at 0% 100%, rgba(34,211,238,.25), transparent 55%), rgba(7,7,12,.94); }
    @keyframes hyperShift { 0% { background-position: 0% 50%; } 100% { background-position: 300% 50%; } }
    .hyper-card[aria-pressed="true"] { box-shadow: 0 0 38px rgba(168,85,247,.75), 0 0 80px rgba(34,211,238,.35); }

    /* Ambient cluster mode backdrop */
    body.hyper-mode #ambient { opacity: 1; }
    #ambient { opacity: 0; transition: opacity 1s var(--ease); }
    .grid-bg { background-image: linear-gradient(rgba(168,85,247,.08) 1px, transparent 1px), linear-gradient(90deg, rgba(34,211,238,.07) 1px, transparent 1px); background-size: 44px 44px; mask-image: radial-gradient(ellipse at 50% 30%, #000 20%, transparent 70%); -webkit-mask-image: radial-gradient(ellipse at 50% 30%, #000 20%, transparent 70%); }

    /* Neural Synthesis SVG */
    #neural { display: grid; grid-template-rows: 0fr; opacity: 0; transition: grid-template-rows .75s var(--ease), opacity .75s var(--ease); }
    body.hyper-mode #neural { grid-template-rows: 1fr; opacity: 1; }
    .flow { stroke-dasharray: 6 10; animation: flow 1.3s linear infinite; }
    body.is-thinking .flow { animation-duration: .45s; }
    @keyframes flow { to { stroke-dashoffset: -32; } }
    .node { animation: nodePulse 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes nodePulse { 0%,100% { transform: scale(1); opacity: .85; } 50% { transform: scale(1.15); opacity: 1; } }
    .core { animation: corePulse 2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes corePulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.12); } }

    /* Chat bubble animations */
    .msg { animation: msgIn .45s var(--ease) both; }
    @keyframes msgIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .scroll-thin::-webkit-scrollbar { width: 5px; }
    .scroll-thin::-webkit-scrollbar-thumb { background: rgba(255,255,255,.09); border-radius: 9999px; }
  </style>
</head>
<body class="h-full overflow-hidden bg-black font-sans text-white">

  <!-- ================= CINEMATIC SPLASH ================= -->
  <div id="splash" class="fixed inset-0 z-[100] flex items-center justify-center bg-black" role="status" aria-label="Loading Hot Ai">
    <div class="pointer-events-none absolute inset-0 overflow-hidden" aria-hidden="true">
      <svg class="fuse-logo fuse-ollama" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="3"></rect><path d="m9 10 2 2-2 2"></path><path d="M13 14h2"></path></svg>
      <svg class="fuse-logo fuse-groq" viewBox="0 0 24 24" fill="currentColor"><path d="M13 2 3 14h7v8l11-13h-8l0-7z"></path></svg>
      <svg class="fuse-logo fuse-gemini" viewBox="0 0 24 24"><defs><linearGradient id="geminiGradSplash" x1="0" y1="0" x2="24" y2="24" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#38bdf8" /><stop offset="50%" stop-color="#818cf8" /><stop offset="100%" stop-color="#c084fc" /></linearGradient></defs><path fill="url(#geminiGradSplash)" d="M11.04 19.32Q12 21.51 12 24q0-2.49.93-4.68.96-2.19 2.58-3.81t3.81-2.55Q21.51 12 24 12q-2.49 0-4.68-.93a12.3 12.3 0 0 1-3.81-2.58 12.3 12.3 0 0 1-2.58-3.81Q12 2.49 12 0q0 2.49-.96 4.68-.93 2.19-2.55 3.81a12.3 12.3 0 0 1-3.81 2.58Q2.49 12 0 12q2.49 0 4.68.96 2.19.93 3.81 2.55t2.55 3.81"/></svg>
      <div class="fuse-ring"></div><div class="fuse-flash"></div>
    </div>
    <div class="relative flex flex-col items-center text-center">
      <h2 class="title-hyper text-5xl font-black uppercase md:text-7xl font-mono"><span class="bg-gradient-to-r from-cyan-300 via-violet-400 to-pink-400 bg-clip-text text-transparent">HYPER CLUSTER</span></h2>
      <div class="absolute inset-0 flex flex-col items-center justify-center">
        <h1 class="title-hotai text-6xl font-semibold tracking-tight md:text-7xl"><span class="fuse-gradient inline-block pb-2">Hot Ai</span></h1>
        <p class="sig-sajit mt-3 text-sm tracking-[0.22em] uppercase text-white/50">presented by <span class="font-medium text-white/90">Sajit Gazula</span></p>
      </div>
    </div>
  </div>

  <!-- Ambient Backdrop -->
  <div id="ambient" class="pointer-events-none fixed inset-0 z-0" aria-hidden="true">
    <div class="grid-bg absolute inset-0"></div>
    <div class="absolute -top-40 left-1/2 h-[520px] w-[820px] -translate-x-1/2 rounded-full bg-violet-600/20 blur-[130px]"></div>
    <div class="absolute -bottom-40 right-0 h-[440px] w-[620px] rounded-full bg-cyan-500/15 blur-[120px]"></div>
  </div>

  <div class="relative z-10 flex h-full flex-col">
    <!-- Header -->
    <header class="flex items-center justify-between px-8 pt-6">
      <div class="flex items-center gap-3">
        <div class="h-3 w-3 rounded-full bg-gradient-to-br from-orange-400 to-rose-600 shadow-[0_0_14px_rgba(249,115,22,.8)]" aria-hidden="true"></div>
        <span class="text-sm font-semibold tracking-tight">Hot Ai</span>
        <span class="text-xs font-mono text-white/40 pl-1">v3.1</span>
      </div>

      <!-- Center Status Pill -->
      <div class="flex items-center gap-2 rounded-full glass px-3.5 py-1.5 text-xs text-white/70">
        <span id="modeDot" class="h-2 w-2 rounded-full bg-amber-400 shadow-[0_0_8px_#f59e0b]" aria-hidden="true"></span>
        <span id="modeLabel" class="font-medium">Ollama (Llama 3.1)</span>
        <span class="text-white/20" aria-hidden="true">/</span>
        <span id="modeSub" class="font-mono text-[11px] text-white/45">local engine</span>
      </div>

      <!-- Network State Toggle -->
      <div class="flex items-center gap-4">
        <button type="button" id="networkToggle" role="switch" aria-checked="false" class="glass group flex items-center gap-3 rounded-full border border-white/10 px-3.5 py-1.5 text-xs text-white/80 focus-visible:outline-none">
          <span id="networkText" class="font-medium text-white/70">Offline (Local Engine)</span>
          <div class="relative flex h-5 w-10 items-center rounded-full bg-white/10 p-0.5">
            <div class="knob h-4 w-4 rounded-full bg-amber-400 shadow-[0_0_8px_rgba(245,158,11,0.6)]"></div>
          </div>
        </button>
      </div>
    </header>

    <!-- Main Chat Workspace -->
    <main class="mx-auto flex min-h-0 w-full max-w-3xl flex-1 flex-col px-6">
      <!-- Neural Synthesis Visualizer -->
      <section id="neural" aria-label="Neural Synthesis Visualizer" aria-hidden="true">
        <div class="overflow-hidden">
          <div class="mt-4 flex flex-col items-center">
            <svg viewBox="0 0 520 160" class="h-36 w-full max-w-xl" role="img">
              <defs>
                <radialGradient id="coreGrad" cx="50%" cy="45%" r="60%"><stop offset="0%" stop-color="#ffffff" /><stop offset="35%" stop-color="#c4b5fd" /><stop offset="75%" stop-color="#7c3aed" /><stop offset="100%" stop-color="#1e0b3a" /></radialGradient>
                <linearGradient id="lineGrad" x1="0" x2="1"><stop offset="0%" stop-color="#22d3ee" /><stop offset="50%" stop-color="#a855f7" /><stop offset="100%" stop-color="#f97316" /></linearGradient>
                <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3.5" result="b" /><feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge></filter>
              </defs>
              <g stroke="rgba(255,255,255,.08)" stroke-width="1.5" fill="none"><path d="M70 40 C 170 40, 200 80, 260 80" /><path d="M260 20 L 260 80" /><path d="M450 40 C 350 40, 320 80, 260 80" /></g>
              <g stroke="url(#lineGrad)" stroke-width="2" fill="none" stroke-linecap="round" filter="url(#glow)"><path class="flow" d="M70 40 C 170 40, 200 80, 260 80" /><path class="flow" d="M260 20 L 260 80" style="animation-delay:-.4s" /><path class="flow" d="M450 40 C 350 40, 320 80, 260 80" style="animation-delay:-.8s" /></g>
              <g filter="url(#glow)"><circle class="node" cx="70" cy="40" r="8" fill="#f59e0b" /><circle class="node" cx="260" cy="18" r="8" fill="#f97316" /><circle class="node" cx="450" cy="40" r="8" fill="#10b981" /></g>
              <g font-family="JetBrains Mono, monospace" font-size="9" fill="rgba(255,255,255,.55)"><text x="70" y="62" text-anchor="middle">OLLAMA</text><text x="296" y="22" text-anchor="start">GROQ</text><text x="450" y="62" text-anchor="middle">GEMINI</text></g>
              <circle cx="260" cy="80" r="32" fill="none" stroke="rgba(168,85,247,.4)" stroke-width="1" stroke-dasharray="3 6" />
              <circle class="core" cx="260" cy="80" r="18" fill="url(#coreGrad)" filter="url(#glow)" />
              <text x="260" y="142" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" letter-spacing="3" fill="rgba(196,181,253,.85)">NEURAL SYNTHESIS</text>
            </svg>
            <p id="neuralStatus" class="-mt-2 font-mono text-[11px] text-cyan-300/70">3 models online · consensus ready</p>
          </div>
        </div>
      </section>

      <!-- Chat History -->
      <div id="chat" class="scroll-thin min-h-0 flex-1 space-y-5 overflow-y-auto py-6" aria-live="polite"></div>

      <!-- Composer Bar -->
      <form id="composer" class="pb-4" autocomplete="off">
        <div id="inputPanel" class="glass smooth flex items-end gap-2 rounded-[1.75rem] p-2 pl-5">
          <textarea id="prompt" rows="1" placeholder="Talk with Hot Ai…" class="max-h-40 min-h-[44px] flex-1 resize-none bg-transparent py-3 text-[15px] leading-relaxed text-white placeholder:text-white/30 focus:outline-none"></textarea>
          <!-- Mic button removed completely for silent operation -->
          <button type="submit" id="sendBtn" disabled class="gloss grid h-11 w-11 shrink-0 place-items-center rounded-full bg-white text-black transition-all hover:scale-105 disabled:opacity-30 disabled:cursor-not-allowed focus-visible:outline-none ml-auto">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg>
          </button>

    </main>

    <!-- Centered Dock -->
    <nav class="flex w-full justify-center px-8 pb-6" aria-label="Engine selection">
      <div class="flex items-center justify-center gap-4" role="group" aria-label="Model modes">
        <button type="button" data-mode="ollama" style="--accent:#f59e0b" class="mode-card glass gloss flex h-24 w-44 flex-col justify-between rounded-[1.25rem] p-3.5 text-left focus-visible:outline-none" aria-pressed="true">
          <div class="flex items-center justify-between"><span class="font-mono text-[9px] tracking-widest text-amber-400">LOCAL</span><span class="dot h-2 w-2 rounded-full" aria-hidden="true"></span></div>
          <div><div class="text-sm font-semibold tracking-tight text-white">Ollama</div><div class="text-[11px] text-white/40">Llama 3.1 · Private</div></div>
        </button>
        <button type="button" data-mode="groq" style="--accent:#f97316" class="mode-card glass gloss flex h-24 w-44 flex-col justify-between rounded-[1.25rem] p-3.5 text-left focus-visible:outline-none" aria-pressed="false">
          <div class="flex items-center justify-between"><span class="font-mono text-[9px] tracking-widest text-orange-400">CLOUD SPEED</span><span class="dot h-2 w-2 rounded-full" aria-hidden="true"></span></div>
          <div><div class="text-sm font-semibold tracking-tight text-white">Groq Engine</div><div class="text-[11px] text-white/40">DeepSeek / Llama 3.3</div></div>

        <button type="button" data-mode="gemini" style="--accent:#10b981" class="mode-card glass gloss flex h-24 w-44 flex-col justify-between rounded-[1.25rem] p-3.5 text-left focus-visible:outline-none" aria-pressed="false">
          <div class="flex items-center justify-between"><span class="font-mono text-[9px] tracking-widest text-emerald-400">GOOGLE</span><span class="dot h-2 w-2 rounded-full" aria-hidden="true"></span></div>
          <div><div class="text-sm font-semibold tracking-tight text-white">Google Gemini</div><div class="text-[11px] text-white/40">Flash · 1M Context</div></div>
        </button>
        <button type="button" data-mode="hyper" class="hyper-card w-64 text-left focus-visible:outline-none" aria-pressed="false">
          <div class="inner gloss flex flex-col justify-between p-3.5">
            <div class="flex items-center justify-between">
              <span class="font-mono text-[9px] tracking-[0.2em] text-cyan-300 font-semibold">MULTI-MODEL</span>

          </div>
        </button>
      </div>
    </nav>
  </div>

  <script>
  (() => {
    /* ---------- SPLASH SEQUENCE CONTROL ---------- */
    const splash = document.getElementById('splash');
    setTimeout(() => {
      splash.classList.add('is-leaving');
      setTimeout(() => splash.remove(), 900);
    }, 4500);

    /* ---------- MODES & STATE ---------- */
    const MODES = {
      ollama: { name: 'Ollama (Llama 3.1)', tag: 'local engine', accent: '#f59e0b', hint: 'Llama 3.1 running locally' },
      groq: { name: 'Groq Engine', tag: 'cloud speed', accent: '#f97316', hint: 'DeepSeek / Llama 3.3 via Groq' },
      gemini: { name: 'Google Gemini', tag: 'google cloud', accent: '#10b981', hint: 'Gemini 1.5/2.5 Flash' },
      hyper: { name: 'Hyper Cluster', tag: 'consensus', accent: '#a855f7', hint: 'Three models synthesizing consensus' }
    };

    let mode = 'ollama';
    let isOnline = false;
    let busy = false;
    const histories = { ollama: [], groq: [], gemini: [], hyper: [] };

    const modeLabel = document.getElementById('modeLabel');
    const modeSub = document.getElementById('modeSub');
    const modeDot = document.getElementById('modeDot');
    const neural = document.getElementById('neural');
    const neuralStatus = document.getElementById('neuralStatus');
    const chat = document.getElementById('chat');
    const prompt = document.getElementById('prompt');
    const sendBtn = document.getElementById('sendBtn');
    const networkToggle = document.getElementById('networkToggle');
    const networkText = document.getElementById('networkText');

    /* ---------- NETWORK TOGGLE ---------- */
    networkToggle.addEventListener('click', () => {
      isOnline = !isOnline;
      networkToggle.setAttribute('aria-checked', String(isOnline));
      if (isOnline) {
        networkText.textContent = 'Online (Cloud Hub)';
        networkToggle.querySelector('.knob').style.background = '#22d3ee';
        networkToggle.querySelector('.knob').style.boxShadow = '0 0 12px #22d3ee';
      } else {
        networkText.textContent = 'Offline (Local Engine)';
        networkToggle.querySelector('.knob').style.background = '#f59e0b';
        networkToggle.querySelector('.knob').style.boxShadow = '0 0 8px rgba(245,158,11,0.6)';
      }
      if (window.pywebview && window.pywebview.api && window.pywebview.api.toggle_network) {
        window.pywebview.api.toggle_network(isOnline);
      }
    });

    /* ---------- MODE SWITCHING ---------- */
    function setMode(next) {
      mode = next;
      const m = MODES[next];
      const isHyper = next === 'hyper';

      document.body.classList.toggle('hyper-mode', isHyper);
      neural.setAttribute('aria-hidden', String(!isHyper));
      document.querySelectorAll('[data-mode]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.mode === next)));

      modeLabel.textContent = m.name;
      modeSub.textContent = isHyper ? 'ollama + groq + gemini' : m.tag;
      modeDot.style.background = m.accent;
      modeDot.style.boxShadow = `0 0 8px ${m.accent}`;
      prompt.placeholder = isHyper ? 'Ask the cluster — models will synthesize one answer…' : `Ask ${m.name}…`;

      renderChat();

      if (window.pywebview && window.pywebview.api) {
        window.pywebview.api.switch_mode(next);
      }
    }
    document.querySelectorAll('[data-mode]').forEach(b => b.addEventListener('click', () => setMode(b.dataset.mode)));

    /* ---------- CHAT RENDERING ---------- */
    const escapeHTML = s => s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    function emptyState() {
      const isHyper = mode === 'hyper';
      const m = MODES[mode];
      return `
        <div class="msg flex h-full flex-col items-center justify-center text-center">
          <div class="mb-4 h-2.5 w-2.5 rounded-full" style="background:${m.accent};box-shadow:0 0 18px ${m.accent}"></div>
          <h2 class="text-2xl font-semibold tracking-tight ${isHyper ? 'bg-gradient-to-r from-cyan-200 via-violet-200 to-pink-200 bg-clip-text text-transparent' : 'text-white'}">
            ${isHyper ? 'Hyper Cluster Online.' : `${m.name} Ready.`}
          </h2>
          <p class="mt-2 max-w-sm text-xs text-white/40">
            ${isHyper ? 'Parallel multi-agent consensus network active.' : m.hint}
          </p>
        </div>`;
    }

    function bubble(msg) {
      if (msg.role === 'user') {
        return `<div class="msg flex justify-end"><div class="max-w-[80%] rounded-2xl rounded-br-sm bg-white/[0.09] px-4 py-2.5 text-[14px] leading-relaxed text-white/95">${escapeHTML(msg.text)}</div></div>`;
      }
      const m = MODES[mode];
      const isHyper = mode === 'hyper';
      return `
        <div class="msg flex gap-3">
          <div class="mt-1 h-5 w-5 shrink-0 rounded-full" style="background:${m.accent};box-shadow:0 0 10px ${m.accent}80" aria-hidden="true"></div>
          <div class="min-w-0 flex-1 ${isHyper ? 'rounded-2xl border border-violet-400/20 bg-violet-500/[0.05] p-4' : 'pt-0.5'}">
            <div class="mb-1 font-mono text-[10px] ${isHyper ? 'text-violet-300' : 'text-white/35'}">${isHyper ? 'SYNTHESIZED CONSENSUS' : m.name}</div>
            <div class="text-[14px] leading-relaxed text-white/85 whitespace-pre-wrap">${escapeHTML(msg.text)}</div>
          </div>
        </div>`;
    }

    function renderChat() {
      const h = histories[mode];
      chat.innerHTML = h.length ? h.map(bubble).join('') : emptyState();
      chat.scrollTop = chat.scrollHeight;
    }

    /* ---------- SEND MESSAGE BRIDGE ---------- */
    async function send(text) {
      if (busy || !text.trim()) return;
      busy = true;
      const activeMode = mode;
      histories[activeMode].push({ role: 'user', text: text.trim() });
      prompt.value = ''; autoGrow(); updateSend();
      renderChat();

      const typingEl = document.createElement('div');
      typingEl.className = 'msg flex items-center gap-2 text-xs font-mono text-white/40';
      typingEl.innerHTML = `<span class="h-1.5 w-1.5 rounded-full bg-white/60 animate-ping"></span> Thinking...`;
      chat.appendChild(typingEl);
      chat.scrollTop = chat.scrollHeight;

      if (activeMode === 'hyper') {
        document.body.classList.add('is-thinking');
        neuralStatus.textContent = 'dispatching to models in parallel…';
      }

      let reply = "";
      if (window.pywebview && window.pywebview.api) {
        try {
          reply = await window.pywebview.api.send_message(text.trim());
        } catch (err) {
          reply = "Backend Communication Error: " + (err.message || err);
        }
      } else {
        reply = "Hot Ai bridge running in browser preview mode.";
      }

      typingEl.remove();
      document.body.classList.remove('is-thinking');
      if (activeMode === 'hyper') neuralStatus.textContent = '3 models online · consensus ready';

      histories[activeMode].push({ role: 'ai', text: reply });
      busy = false;
      if (mode === activeMode) renderChat();
      updateSend();
    }

    /* ---------- COMPOSER LISTENERS ---------- */
    function autoGrow() {
      prompt.style.height = 'auto';
      prompt.style.height = Math.min(prompt.scrollHeight, 150) + 'px';
    }
    function updateSend() {
      sendBtn.disabled = busy || !prompt.value.trim();
    }
    prompt.addEventListener('input', () => { autoGrow(); updateSend(); });
    prompt.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        send(prompt.value);
      }
    });
    document.getElementById('composer').addEventListener('submit', e => {
      e.preventDefault();
      send(prompt.value);
    });

    /* Init */
    setMode('ollama');
  })();
  </script>
</body>
</html>
